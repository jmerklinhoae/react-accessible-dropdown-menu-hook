name: Main CI

on:
  push:
    branches:
      - master
      - ci-verify
    tags:
      - v[0-9]+.[0-9]+.[0-9]+
      - v[0-9]+.[0-9]+.[0-9]+-alpha.[0-9]+
      - v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+
      - v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+
  pull_request:
    branches:
      - master

# Never download Chromium during installs; the only job that needs a browser (test) launches the runner's preinstalled Chrome instead, which is far more reliable than Puppeteer's download/extract on hosted runners
env:
  PUPPETEER_SKIP_DOWNLOAD: 'true'

jobs:
  lint:
    name: Lint code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: lts/*
      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "::set-output name=dir::$(yarn cache dir)"
      - uses: actions/cache@v3
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      - run: yarn dev
      - run: yarn lint
  test:
    name: Run tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [lts/*, current]
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "::set-output name=dir::$(yarn cache dir)"
      - uses: actions/cache@v3
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      - run: yarn dev
      # ubuntu-latest ships Google Chrome preinstalled; point Puppeteer at it (jest-puppeteer.config.js reads PUPPETEER_EXECUTABLE_PATH) rather than downloading a build, whose extraction has proven unreliable on hosted runners
      - name: Use the runner's preinstalled Chrome
        run: |
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || true)"
          if [ -z "$CHROME" ]; then
            echo "::error::No preinstalled Google Chrome found on the runner"
            exit 1
          fi
          echo "Using $("$CHROME" --version) at $CHROME"
          echo "PUPPETEER_EXECUTABLE_PATH=$CHROME" >> "$GITHUB_ENV"
      # Option C, attempt 1 (namespace sandbox): grant userns to only the Chrome binary via a scoped AppArmor profile, leaving the kernel restriction in place. NOTE: this does NOT work for the system google-chrome, which bundles a setuid helper and therefore never takes the namespace-sandbox path — so the test job fails here. Kept as a documented dead-end.
      - name: Allow Chrome's user-namespace sandbox via AppArmor
        run: |
          {
            echo 'abi <abi/4.0>,'
            echo 'include <tunables/global>'
            echo 'profile chrome-userns /opt/google/chrome/chrome flags=(unconfined) {'
            echo '  userns,'
            echo '  include if exists <local/chrome-userns>'
            echo '}'
          } | sudo tee /etc/apparmor.d/chrome-userns >/dev/null
          sudo apparmor_parser -r /etc/apparmor.d/chrome-userns
      - run: yarn test
      - name: Codecov
        uses: codecov/codecov-action@v3
  verify-website:
    name: Verify website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: lts/*
      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "::set-output name=dir::$(yarn cache dir)"
      - uses: actions/cache@v3
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      - run: yarn dev
      - run: yarn --cwd ./website type-check
      - run: yarn --cwd ./website build
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
      - verify-website
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: lts/*
          registry-url: 'https://registry.npmjs.org'
      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "::set-output name=dir::$(yarn cache dir)"
      - uses: actions/cache@v3
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      - run: yarn dev
      - run: |
          if [[ "$GITHUB_REF" =~ -alpha ]]; then
            npm publish --tag alpha
          elif [[ "$GITHUB_REF" =~ -beta ]]; then
            npm publish --tag beta
          else
            npm publish
          fi
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
      - verify-website
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: lts/*
          registry-url: 'https://registry.npmjs.org'
      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "::set-output name=dir::$(yarn cache dir)"
      - uses: actions/cache@v3
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      - run: yarn dev
      - run: yarn --cwd ./website build
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@4.0.0
        with:
          branch: gh-pages
          folder: website/build
